name: Live smoke

on:
  push:
    branches: [main]
    paths:
      - worker.js
      - config-page.js
      - source-registry.js
      - test-live.mjs
      - public/logo.png
      - 'public/branding/**'
      - .github/workflows/live-smoke.yml
  workflow_dispatch:
  schedule:
    - cron: '23 5 * * *'

permissions:
  contents: read

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run test:live