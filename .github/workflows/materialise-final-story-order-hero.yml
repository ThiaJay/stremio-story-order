name: Materialise Final Story Order Hero

on:
  push:
    branches: [main]
    paths:
      - '.materialise-final-story-order-hero'

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Rebuild approved panoramic WebP
        shell: bash
        run: |
          set -euo pipefail
          cat .hero-final/part* | tr -d '\n\r' | base64 -d > /tmp/story-order-hero.webp
          python3 - <<'PY'
          import hashlib, pathlib
          p=pathlib.Path("/tmp/story-order-hero.webp")
          d=p.read_bytes()
          assert len(d)==22788, len(d)
          assert d[:4]==b"RIFF" and d[8:12]==b"WEBP"
          assert hashlib.sha256(d).hexdigest()=="391c315d8fa88b94655030fbbc82ebd098e81c63c142a3f24e68fc73827d20c3"
          print("hero_verified", len(d), hashlib.sha256(d).hexdigest())
          PY
          cp /tmp/story-order-hero.webp public/branding/v3/story-order-hero.webp
          cat > public/branding/v2/story-order-order-flow.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 375" role="img" aria-labelledby="title desc"><title id="title">Story Order panoramic journey</title><desc id="desc">Unordered episode and special cards flow through Story Order into one coherent narrative sequence.</desc><image width="1000" height="375" href="https://raw.githubusercontent.com/ThiaJay/stremio-story-order/main/public/branding/v3/story-order-hero.webp?v=1.0.17.1"/></svg>
          SVG
          cp public/branding/v2/story-order-order-flow.svg public/branding/v3/story-order-hero.svg
      - name: Update asset contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path("config-page.js")
          s=p.read_text()
          s=s.replace('branding/v3/story-order-hero.webp?v=1.0.17','branding/v3/story-order-hero.webp?v=1.0.17.1')
          p.write_text(s)

          p=Path("test-worker.mjs")
          s=p.read_text()
          s=s.replace('f898ac82cc64695570a6e53036a19dd523d76ed5','ed59296c278d885817c504afece4aa73c2c33c66')
          s=s.replace('heroPrimary.length>7000','heroPrimary.length>20000')
          s=s.replace(r'branding\/v3\/story-order-hero\.webp\?v=1\.0\.17',r'branding\/v3\/story-order-hero\.webp\?v=1\.0\.17\.1')
          p.write_text(s)

          p=Path("test-live.mjs")
          s=p.read_text()
          s=s.replace('story-order-hero.webp?v=1.0.17','story-order-hero.webp?v=1.0.17.1')
          s=s.replace(r'branding\/v3\/story-order-hero\.webp\?v=1\.0\.17',r'branding\/v3\/story-order-hero\.webp\?v=1\.0\.17\.1')
          s=s.replace('assert.ok(liveHero.length>7000,"live hero is unexpectedly small");','assert.equal(liveHero.length,22788,"live hero must match the approved panoramic master");')
          s=s.replace('assert.equal(legacyHero,liveHero,"legacy hero URL must mirror the approved panoramic master");','assert.match(legacyHero,/story-order-hero\\.webp\\?v=1\\.0\\.17\\.1/,"legacy hero URL must reference the approved panoramic master");')
          p.write_text(s)
          PY
      - name: Commit reconstructed asset
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .hero-final .hero-transfer .asset-transfer
          rm -f .materialise-final-story-order-hero .materialise-story-order-hero
          rm -f .github/workflows/materialise-story-order-hero.yml
          rm -f .github/workflows/materialise-final-story-order-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "asset: publish approved Story Order panoramic hero"
          git push origin HEAD:main
