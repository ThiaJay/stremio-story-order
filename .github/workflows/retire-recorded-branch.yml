name: Retire recorded branch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  retire:
    if: github.event.head_commit.message == 'Retire recorded superseded branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Delete recorded superseded branch
        shell: bash
        run: |
          set -euo pipefail
          branch="fix/story-order-branding-20260919"
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            git push origin --delete "$branch"
          fi
          if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
            echo "::error::Branch still exists after deletion: $branch"
            exit 1
          fi
