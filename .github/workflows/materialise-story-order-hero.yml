name: Materialise Story Order Hero

on:
  push:
    branches: [main]
    paths:
      - '.materialise-story-order-hero'

permissions:
  contents: write

jobs:
  materialise:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Extract approved panoramic WebP
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, pathlib, re
          source = pathlib.Path("public/branding/v3/story-order-hero.svg").read_text(encoding="utf-8")
          match = re.search(r'data:image/webp;base64,([^"]+)', source)
          if not match:
              raise SystemExit("approved embedded WebP not found")
          data = base64.b64decode(match.group(1), validate=True)
          if data[:4] != b"RIFF" or data[8:12] != b"WEBP":
              raise SystemExit("decoded hero is not WebP")
          target = pathlib.Path("public/branding/v3/story-order-hero.webp")
          target.write_bytes(data)
          print("hero_bytes", len(data))
          print("hero_sha256", hashlib.sha256(data).hexdigest())
          PY
      - name: Commit exact image bytes
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .asset-transfer
          rm -f .materialise-story-order-hero
          rm -f .github/workflows/materialise-story-order-hero.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "asset: materialise approved Story Order panoramic WebP"
          git push origin HEAD:main
