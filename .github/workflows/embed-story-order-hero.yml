name: Embed Story Order Hero

on:
  push:
    branches: [main]
    paths:
      - '.embed-story-order-hero'
      - '.github/workflows/embed-story-order-hero.yml'

permissions:
  contents: write

jobs:
  embed:
    if: github.event.head_commit.message == 'ops: embed Story Order hero in page bundle'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate embedded hero and update release contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, json, re

          hero_path=Path("public/branding/v3/story-order-hero.webp")
          data=hero_path.read_bytes()
          assert len(data)==28482, len(data)
          assert data[:4]==b"RIFF" and data[8:12]==b"WEBP"
          blob=hashlib.sha1(f"blob {len(data)}\\0".encode()+data).hexdigest()
          assert blob=="cddde00199bc6f2a26a0903d01d2564856e896e9", blob

          encoded=base64.b64encode(data).decode("ascii")
          Path("hero-data.js").write_text(
              'export const STORY_ORDER_HERO_DATA = "data:image/webp;base64,'+encoded+'";\\n',
              encoding="utf-8"
          )

          p=Path("config-page.js")
          s=p.read_text(encoding="utf-8")
          if 'import { STORY_ORDER_HERO_DATA } from "./hero-data.js";' not in s:
              s='import { STORY_ORDER_HERO_DATA } from "./hero-data.js";\\n'+s
          s=s.replace('logo.png?v=1.0.18','logo.png?v=1.0.19')
          s=re.sub(r'export const BRAND_HERO_URL = .*?;', 'export const BRAND_HERO_URL = STORY_ORDER_HERO_DATA;', s, count=1)
          s=s.replace('?v=1.0.18','?v=1.0.19')
          p.write_text(s,encoding="utf-8")

          p=Path("worker.js")
          s=p.read_text(encoding="utf-8").replace('const VERSION = "1.0.18";','const VERSION = "1.0.19";')
          p.write_text(s,encoding="utf-8")

          pkg=json.loads(Path("package.json").read_text(encoding="utf-8"))
          pkg["version"]="1.0.19"
          Path("package.json").write_text(json.dumps(pkg,indent=2)+"\\n",encoding="utf-8")

          p=Path("package-lock.json")
          s=p.read_text(encoding="utf-8")
          s=s.replace('"version": "1.0.18"','"version": "1.0.19"',2)
          p.write_text(s,encoding="utf-8")

          p=Path("check-syntax.mjs")
          s=p.read_text(encoding="utf-8")
          s=s.replace('"provider.js", "source-registry.js", "config-page.js", "cache.js"',
                      '"provider.js", "source-registry.js", "config-page.js", "hero-data.js", "cache.js"')
          p.write_text(s,encoding="utf-8")

          p=Path("test-worker.mjs")
          s=p.read_text(encoding="utf-8")
          s=s.replace('logo.png?v=1.0.18','logo.png?v=1.0.19')
          s=s.replace('assert.match(html,/branding\\\\/v3\\\\/story-order-hero\\\\.webp\\\\?v=1\\\\.0\\\\.18/);',
                      'assert.match(html,/data:image\\\\/webp;base64,/);')
          p.write_text(s,encoding="utf-8")

          p=Path("test-live.mjs")
          s=p.read_text(encoding="utf-8")
          s=s.replace('1.0.18','1.0.19')
          s=s.replace('assert.match(liveConfigureHtml,/branding\\\\/v3\\\\/story-order-hero\\\\.webp\\\\?v=1\\\\.0\\\\.19/);',
                      'assert.match(liveConfigureHtml,/data:image\\\\/webp;base64,/);')
          p.write_text(s,encoding="utf-8")

          p=Path("CHANGELOG.md")
          s=p.read_text(encoding="utf-8")
          entry="""## 1.0.19 - 2026-09-25

Reliable embedded cinematic hero.

- Embeds the verified Story Order panoramic WebP directly into the configure page bundle so the hero no longer depends on a separate GitHub image request.
- Keeps the public GitHub hero asset and compatibility URLs available for reuse while removing them from the critical configure-page render path.
- Preserves the spacious 1.0.17 interface, cinematic addon icon, ordering behaviour and stable-ID safety contract.

"""
          p.write_text("# Changelog\\n\\n"+entry+s.split("# Changelog\\n",1)[1].lstrip("\\n"),encoding="utf-8")
          PY
      - name: Verify generated source
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test
          npm audit --audit-level=high
      - name: Commit embedded hero release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Story Order Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add hero-data.js config-page.js worker.js package.json package-lock.json check-syntax.mjs test-worker.mjs test-live.mjs CHANGELOG.md
          git commit -m "fix: embed Story Order cinematic hero"
          git push origin HEAD:main
