name: Refine Story Order Interface

on:
  push:
    branches: [main]
    paths:
      - '.refine-story-order-interface-v2'
      - '.github/workflows/refine-story-order-interface-v2.yml'

permissions:
  contents: write

jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: node scripts/refine-story-order-interface.mjs
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Story Order Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add config-page.js test-worker.mjs CHANGELOG.md
          git commit -m "feat: make Story Order interface more cinematic"
          git push origin HEAD:main
