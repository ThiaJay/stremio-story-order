name: Deploy Story Order

on:
  push:
    branches:
      - 'release/**'
    paths:
      - '.release-ready'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: story-order-production-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - name: Require deployment credential
        shell: bash
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN repository secret is not configured"
            exit 1
          fi
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - run: npm audit --audit-level=high
      - name: Deploy production Worker
        run: npx wrangler deploy --config wrangler.example.toml
      - name: Verify live version
        shell: bash
        run: |
          expected="$(node -p "require('./package.json').version")"
          actual="$(curl -fsS https://stremio-story-order.storyorder.workers.dev/manifest.json | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).version||''))")"
          test "$actual" = "$expected" || {
            echo "::error::Live manifest version $actual does not match expected $expected"
            exit 1
          }
      - name: Run live smoke
        run: npm run test:live
